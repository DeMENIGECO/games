<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Sort Puzzle</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:linear-gradient(135deg,#0b3d2e,#0f766e);
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

#menu{
    padding:20px;
}

button{
    background:#22c55e;
    border:0;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    margin:5px;
    font-size:16px;
}

button:hover{
    filter:brightness(1.15);
}

#game{
    display:none;
}

#info{
    margin:10px;
    font-size:18px;
}


#board{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}


.bottle{
    width:70px;
    height:230px;
    border:4px solid white;
    border-radius:30px 30px 15px 15px;
    display:flex;
    flex-direction:column-reverse;
    overflow:hidden;
    background:#ffffff22;
    cursor:pointer;
}


.liquid{
    height:25%;
    width:100%;
}


.selected{
    outline:5px solid yellow;
}


.locked{
    opacity:.7;
}


#levels{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:5px;
}

.level{
    width:45px;
    height:45px;
}
</style>

</head>

<body>


<h1>🧪 Water Sort Puzzle</h1>


<div id="menu">

<h2>Scegli livello</h2>

<div id="levels"></div>

</div>



<div id="game">

<div id="info">
Livello: <span id="level"></span>
<br>
Mosse: <span id="moves"></span>
</div>


<div id="board"></div>


<button onclick="undo()">↩ Annulla</button>
<button onclick="restart()">🔄 Riavvia</button>
<button onclick="nextLevel()">➡ Prossimo</button>

<br>

<div id="bonus"></div>

</div>



<script>


const colors=[
"red",
"blue",
"green",
"yellow",
"purple",
"orange",
"pink",
"cyan",
"brown",
"lime"
];


let currentLevel=1;
let unlocked=1;

let bottles=[];
let selected=null;
let history=[];
let moves=0;


function createLevels(){

let box=document.getElementById("levels");

for(let i=1;i<=30;i++){

let b=document.createElement("button");

b.className="level";
b.innerText=i;

b.disabled=i>unlocked;

b.onclick=()=>loadLevel(i);

box.appendChild(b);

}

}



function loadLevel(n){

currentLevel=n;

document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";


let colorsCount=Math.min(3+Math.floor(n/3),10);

let tubes=[];


// Creo i colori mescolati
let liquids=[];

for(let i=0;i<colorsCount;i++){

    for(let j=0;j<4;j++){
        liquids.push(colors[i]);
    }

}


// Mescolo più volte in base alla difficoltà
for(let i=0;i<n*10;i++){

    liquids.sort(()=>Math.random()-0.5);

}


// Creo bottiglie
for(let i=0;i<colorsCount;i++){

    tubes.push(
        liquids.splice(0,4)
    );

}


// Bottiglie vuote
tubes.push([]);
tubes.push([]);


// Bonus bottiglia extra
if(n>=10)
    tubes.push([]);


bottles=tubes;

moves=0;
history=[];
selected=null;


render();

}


function render(){

document.getElementById("level").innerText=currentLevel;
document.getElementById("moves").innerText=moves;


let board=document.getElementById("board");
board.innerHTML="";


bottles.forEach((b,i)=>{

let div=document.createElement("div");

div.className="bottle";


if(selected===i)
div.classList.add("selected");


b.forEach(c=>{

let liquid=document.createElement("div");

liquid.className="liquid";
liquid.style.background=c;

div.appendChild(liquid);

});


div.onclick=()=>clickBottle(i);


board.appendChild(div);

});


document.getElementById("bonus").innerHTML=
currentLevel>=30?
"💡 Bonus: puoi usare il suggerimento":
currentLevel>=20?
"🌪 Bonus: livello avanzato":
currentLevel>=10?
"➕ Bottiglia extra":
"";


checkWin();

}



function clickBottle(i){

if(selected===null){

if(bottles[i].length)
selected=i;

}

else{


if(selected===i){

selected=null;

}

else{

move(selected,i);

selected=null;

}


}

render();

}



function move(from,to){


let a=bottles[from];
let b=bottles[to];


if(!a.length)
return;


let color=a[a.length-1];


if(
b.length>=4 ||
(b.length && b[b.length-1]!==color)
)
return;



save();


while(
a.length &&
a[a.length-1]===color &&
b.length<4
){

b.push(a.pop());

}


moves++;

}




function save(){

history.push(
JSON.stringify(bottles)
);

}


function undo(){

if(history.length){

bottles=JSON.parse(
history.pop()
);

moves--;

render();

}

}



function restart(){

loadLevel(currentLevel);

}



function checkWin(){
function checkWin(){

let completed=0;


for(let b of bottles){

    if(
        b.length===4 &&
        b.every(x=>x===b[0])
    ){
        completed++;
    }

}


// Vince solo se tutte le bottiglie con liquido sono completate
let filled=bottles.filter(b=>b.length>0).length;


if(completed===filled){

setTimeout(()=>{

alert("🎉 Livello "+currentLevel+" completato!");

if(currentLevel===unlocked)
    unlocked++;

createLevels();

},300);

}

}


function nextLevel(){

if(currentLevel<30)
loadLevel(currentLevel+1);

}


createLevels();


</script>


</body>
</html>
