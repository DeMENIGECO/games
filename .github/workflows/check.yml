name: 🎮 Check Game PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr:
    name: Verifica PR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Controlla PR
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            const body = process.env.PR_BODY || "";
            const prNumber = Number(process.env.PR_NUMBER);

            const failed = [];

            // ─────────────────────────────
            // 1. Controllo checkbox
            // ─────────────────────────────

            const gameNotPresent =
              /- \[x\] Questo gioco non è giá presente/i.test(body);

            const codeOfConduct =
              /- \[x\] Ho letto il codice di condotta/i.test(body);

            if (!gameNotPresent) {
              failed.push("❌ Checkbox \"Questo gioco non è giá presente\" non selezionata.");
            }

            if (!codeOfConduct) {
              failed.push("❌ Checkbox \"Ho letto il codice di condotta\" non selezionata.");
            }

            // ─────────────────────────────
            // 2. Estrazione ID del gioco
            // ─────────────────────────────

            const idMatch = body.match(
              /ID Univoco Gioco:\s*`([^`]+)`/i
            );

            let gameId = null;

            if (!idMatch) {
              failed.push("❌ ID Univoco Gioco mancante.");
            } else {
              gameId = idMatch[1].trim();

              if (!/^[A-Za-z0-9_-]+\.Games\.[A-Za-z0-9_-]+$/.test(gameId)) {
                failed.push(
                  `❌ ID Univoco Gioco non valido: \`${gameId}\`.`
                );
                gameId = null;
              }
            }

            // ─────────────────────────────
            // 3. Cerca il file HTML
            // ─────────────────────────────

            if (gameId) {
              const expectedFile = `${gameId}.html`;

              let htmlFiles = [];

              try {
                htmlFiles = execSync(
                  "git ls-files '*.html'",
                  { encoding: "utf8" }
                )
                  .split("\n")
                  .map(x => x.trim())
                  .filter(Boolean);
              } catch (error) {
                failed.push("❌ Impossibile analizzare i file HTML della repository.");
              }

              const matchingFile = htmlFiles.find(file =>
                path.basename(file) === expectedFile
              );

              if (!matchingFile) {
                failed.push(
                  `❌ Non è stato trovato il file \`${expectedFile}\` nella repository.`
                );
              }
            }

            // ─────────────────────────────
            // 4. Crea il commento
            // ─────────────────────────────

            let comment;

            if (failed.length === 0) {
              comment =
                `## ✅ PR Test passati!\n\n` +
                `Tutti i controlli automatici sono stati superati.\n\n` +
                `🎮 **Gioco:** \`${gameId}\`\n\n` +
                `Aspetta che i maintainer processino la tua richiesta!`;
            } else {
              comment =
                `## ⚠️ Ops! Qualcosa manca:\n\n` +
                failed.map(item => `- ${item}`).join("\n") +
                `\n\nModifica la tua PR e risolvili.`;
            }

            // ─────────────────────────────
            // 5. Evita commenti duplicati
            // ─────────────────────────────

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              }
            );

            const botComments = comments.filter(comment =>
              comment.user &&
              comment.user.type === "Bot" &&
              comment.body &&
              (
                comment.body.includes("PR Test passati!") ||
                comment.body.includes("Ops! Qualcosa manca:")
              )
            );

            if (botComments.length > 0) {
              const latest = botComments[botComments.length - 1];

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: latest.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

            // ─────────────────────────────
            // 6. Assegna la PR
            // ─────────────────────────────

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                assignees: ["DeMENIGECO"]
              });
            } catch (error) {
              core.warning(
                `Impossibile assegnare automaticamente la PR a DeMENIGECO: ${error.message}`
              );
            }

            // ─────────────────────────────
            // 7. Fallisce il workflow se ci sono errori
            // ─────────────────────────────

            if (failed.length > 0) {
              core.setFailed(
                `Sono falliti ${failed.length} test della PR.`
              );
            }
